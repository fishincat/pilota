[workspace]
members = [
  "pilota",
  "pilota-build",
  "pilota-thrift-parser",
  "pilota-thrift-reflect",
  "pilota-thrift-fieldmask",
  "examples",
]
resolver = "3"

[workspace.package]
authors = ["Pilota Team <pilota@cloudwego.io>"]
edition = "2024"
homepage = "https://cloudwego.io/docs/pilota/"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cloudwego/pilota"
rust-version = "1.85.0"

[workspace.dependencies]
ahash = "0.8"
anyhow = "1"
ariadne = {version = "0.5", features = ["auto-color"]}
async-recursion = "1"
bytes = {version = "1", features = ["serde"]}
chumsky = "0.10"
criterion = {version = "0.7", features = ["html_reports"]}
dashmap = "6"
diffy = "0.4"
faststr = "0.2"

heck = "0.5"
hex = "0.4"
integer-encoding = {version = "4", features = ["tokio", "tokio_async"]}
itertools = "0.14"
lazy_static = "1"
linkedbytes = "0.1"
normpath = "1"
ordered-float = {version = "5", features = ["serde"]}
paste = "1"
petgraph = "0.8"
phf = {version = "0.12", features = ["macros"]}
proc-macro2 = "1"
proptest = "1"
protobuf = {version = "3.7.2"}
protobuf-parse = {version = "3.7.2"}
quote = "1"
rand = "0.9"
rayon = "1"
rustc-hash = "1"
salsa = {version = "0.23.0"}
scoped-tls = "1"
serde = {version = "1", features = ["derive"]}
serde_yaml = "0.9"
smallvec = "1"
syn = "2"
tempfile = "3"
thiserror = "2"
tokio = {version = "1", features = ["io-util"]}
toml = "0.9"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = 'unwind'
rpath = false

[profile.bench]
codegen-units = 1
debug = true
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
rpath = false

[patch.crates-io]
faststr = {git = "https://github.com/fishincat/faststr.git", branch = "bytes_ref"}
